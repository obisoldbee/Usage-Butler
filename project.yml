name: UsageButler

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SUPPORTS_MACCATALYST: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG USAGE_BUTLER_FIXTURES
    Release:
      ENABLE_CODE_COVERAGE: NO
      CLANG_COVERAGE_MAPPING: NO
      GCC_GENERATE_TEST_COVERAGE_FILES: NO
      GCC_INSTRUMENT_PROGRAM_FLOW_ARCS: NO
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES

targets:
  UsageButlerDomain:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Domain
        PRODUCT_MODULE_NAME: UsageButlerDomain
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerCore:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerCore
    dependencies:
      - target: UsageButlerDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Core
        PRODUCT_MODULE_NAME: UsageButlerCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Stage3FixtureCatalog.swift NetworkFixtureCatalog.swift

  UsageButlerProviders:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerProviders
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Providers
        PRODUCT_MODULE_NAME: UsageButlerProviders
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerInfrastructure:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerInfrastructure
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Infrastructure
        PRODUCT_MODULE_NAME: UsageButlerInfrastructure
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerUI:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerUI
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.UI
        PRODUCT_MODULE_NAME: UsageButlerUI
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerNetworkAgent:
    type: tool
    platform: macOS
    sources:
      - UsageButlerNetworkAgent
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
      - target: UsageButlerInfrastructure
    settings:
      base:
        PRODUCT_NAME: UsageButlerNetworkAgent
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.NetworkAgent
        OTHER_CODE_SIGN_FLAGS: "$(inherited) --identifier $(PRODUCT_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  UsageButlerApp:
    type: application
    platform: macOS
    productName: Usage-Butler
    sources:
      - UsageButlerApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
      - target: UsageButlerProviders
      - target: UsageButlerInfrastructure
      - target: UsageButlerUI
      - target: UsageButlerNetworkAgent
        embed: false
    postBuildScripts:
      - name: Embed background network agent
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${destination}/Library/LaunchAgents"
          cp "${BUILT_PRODUCTS_DIR}/UsageButlerNetworkAgent" "${destination}/MacOS/UsageButlerNetworkAgent"
          cp "${SRCROOT}/Config/NetworkAgent.plist" "${destination}/Library/LaunchAgents/io.github.obisoldbee.UsageButler.network-agent.plist"
          plist="${destination}/Library/LaunchAgents/io.github.obisoldbee.UsageButler.network-agent.plist"
          /usr/libexec/PlistBuddy -c "Set :Label ${AGENT_SERVICE_NAME}" "${plist}"
          /usr/libexec/PlistBuddy -c "Delete :MachServices" "${plist}"
          /usr/libexec/PlistBuddy -c "Add :MachServices dict" "${plist}"
          /usr/libexec/PlistBuddy -c "Add :MachServices:${AGENT_SERVICE_NAME} bool true" "${plist}"
        inputFiles:
          - $(SRCROOT)/Config/NetworkAgent.plist
          - $(BUILT_PRODUCTS_DIR)/UsageButlerNetworkAgent
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/UsageButlerNetworkAgent
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/io.github.obisoldbee.UsageButler.network-agent.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler
        PRODUCT_NAME: Usage-Butler
        PRODUCT_MODULE_NAME: UsageButlerApp
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/UsageButler.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        AGENT_SERVICE_NAME: io.github.obisoldbee.UsageButler.network-agent
        MARKETING_VERSION: 0.5.2
        CURRENT_PROJECT_VERSION: 13
        SWIFT_EMIT_LOC_STRINGS: YES

  UsageButlerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - UsageButlerTests
      - UsageButlerApp/BackgroundNetworkController.swift
      - UsageButlerApp/NetworkHistoryWindowController.swift
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
      - target: UsageButlerProviders
      - target: UsageButlerInfrastructure
      - target: UsageButlerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UsageButler:
    build:
      targets:
        UsageButlerApp: all
        UsageButlerTests: [test]
    run:
      config: Debug
      executable: UsageButlerApp
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: UsageButlerTests
