name: UsageButler

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SUPPORTS_MACCATALYST: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG USAGE_BUTLER_FIXTURES
    Release:
      ENABLE_CODE_COVERAGE: NO
      CLANG_COVERAGE_MAPPING: NO
      GCC_GENERATE_TEST_COVERAGE_FILES: NO
      GCC_INSTRUMENT_PROGRAM_FLOW_ARCS: NO
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES

targets:
  UsageButlerDomain:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Domain
        PRODUCT_MODULE_NAME: UsageButlerDomain
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerCore:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerCore
    dependencies:
      - target: UsageButlerDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Core
        PRODUCT_MODULE_NAME: UsageButlerCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Stage3FixtureCatalog.swift NetworkFixtureCatalog.swift

  UsageButlerProviders:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerProviders
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Providers
        PRODUCT_MODULE_NAME: UsageButlerProviders
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerInfrastructure:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerInfrastructure
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Infrastructure
        PRODUCT_MODULE_NAME: UsageButlerInfrastructure
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerUI:
    type: framework.static
    platform: macOS
    sources:
      - UsageButlerUI
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.UI
        PRODUCT_MODULE_NAME: UsageButlerUI
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  UsageButlerApp:
    type: application
    platform: macOS
    productName: Usage-Butler
    sources:
      - UsageButlerApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
      - target: UsageButlerProviders
      - target: UsageButlerInfrastructure
      - target: UsageButlerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler
        PRODUCT_NAME: Usage-Butler
        PRODUCT_MODULE_NAME: UsageButlerApp
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/UsageButler.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 4
        SWIFT_EMIT_LOC_STRINGS: YES

  UsageButlerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - UsageButlerTests
    dependencies:
      - target: UsageButlerDomain
      - target: UsageButlerCore
      - target: UsageButlerProviders
      - target: UsageButlerInfrastructure
      - target: UsageButlerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.obisoldbee.UsageButler.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UsageButler:
    build:
      targets:
        UsageButlerApp: all
        UsageButlerTests: [test]
    run:
      config: Debug
      executable: UsageButlerApp
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: UsageButlerTests
